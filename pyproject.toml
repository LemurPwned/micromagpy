[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "micromagpy"
dynamic = ["version", "description"]
authors = [
    { name = "LemurPwned", email = "lemurpwned@gmail.com" }
]
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.LESSER", "CREDITS.md"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
  "micromagnetics",
  "simulation",
  "LLG",
  "spintronics",
  "1/f noise",
]
dependencies = [
  "numba >= 0.68.1",
  "numpy >= 2.5.5",
  "scipy >= 1.18.1",
]

[project.optional-dependencies]
test = ["pytest >= 9.2.0"]
examples = [
  "matplotlib >= 3.11.2",
  "tqdm >= 4.70.1",
  "pillow >= 13.0.0",
]

[project.urls]
Source = "https://github.com/LemurPwned/micromagpy"
Issues = "https://github.com/LemurPwned/micromagpy/issues"

[tool.flit.sdist]
include = ["tests/"]
exclude = ["examples/", "benchmarks/", "sp4_*.py", ".github/", ".pre-commit-config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
