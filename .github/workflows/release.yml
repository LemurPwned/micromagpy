name: release

# Builds the sdist and wheel and publishes them to PyPI with Trusted Publishing
# (OIDC): no API tokens are stored in the repository.
#
# * GitHub release "published"          -> build, check, publish to PyPI
# * push of a v* tag                    -> build and check only (dry run)
# * manual run (workflow_dispatch)      -> build, check and, optionally,
#                                          publish to TestPyPI

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish the build to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Check the tag matches the package version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('micromagpy/__init__.py').read_text()).group(1))")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match micromagpy.__version__ = $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/micromagpy
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/micromagpy
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
